<div id="pwa-bar" hidden><img src="icon-192.png" alt=""><div class="t"><b>Jotun Endüstri'yi yükle</b><span id="pwa-msg">Telefonunda uygulama olarak açılsın.</span></div><button type="button" id="pwa-in">Yükle</button><button type="button" id="pwa-x" aria-label="Kapat">×</button></div>
<script>
(function(){
  if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){r.update();}).catch(function(){});});var rl=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(rl)return;rl=true;location.reload();});}
  var bar=document.getElementById("pwa-bar"), inst=document.getElementById("pwa-in"), msg=document.getElementById("pwa-msg"), ev=null;
  var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  var closed=false; try{closed=localStorage.getItem("pwa-x")==="1"}catch(e){}
  if(standalone||closed) return;
  document.getElementById("pwa-x").onclick=function(){bar.hidden=true;try{localStorage.setItem("pwa-x","1")}catch(e){}};
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;bar.hidden=false;});
  inst.onclick=function(){ if(ev){ev.prompt();ev.userChoice.then(function(){bar.hidden=true;ev=null;});} };
  var ua=navigator.userAgent, ios=/iphone|ipad|ipod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1), android=/android/i.test(ua), mobile=ios||android||/mobi/i.test(ua);
  if(!mobile) msg.textContent="Bilgisayarında ayrı bir uygulama penceresinde açılsın.";
  if(android) msg.innerHTML="Telefonunda uygulama olarak açılsın. <a href='https://github.com/kurnazrecep16-web/jotun-rehber/releases/download/android/JotunEndustri.apk' style='color:#f0ab00'>APK indir</a>";
  var mac=/Macintosh/.test(ua)&&!ios&&/Safari/.test(ua)&&!/Chrome|Edg/.test(ua);
  if(mac){ msg.innerHTML="Menüden <b style='display:inline'>Dosya → Dock'a Ekle</b>'yi seçin."; inst.hidden=true; bar.hidden=false; }
  if(ios){ msg.innerHTML="Alttaki <b style='display:inline'>Paylaş</b> düğmesine basın, sonra <b style='display:inline'>Ana Ekrana Ekle</b>'yi seçin."; inst.hidden=true; bar.hidden=false; }
  addEventListener("appinstalled",function(){bar.hidden=true;});
})();
</script>
</body></html>
