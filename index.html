<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Bağlantı geçersiz</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f2f7;color:#1c1c1e;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}.c{background:#1c1c1e!important}}
.c{max-width:420px;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 6px 24px rgba(3,30,69,.12)}
h1{margin:0 0 8px;font-size:20px}p{margin:0;color:#6b7280}</style></head><body>
<div class="c"><h1>Bu bağlantı artık kullanılmıyor</h1><p>Güncel bağlantı için Jotun bölge yöneticinize başvurun.</p></div>
<script>
(async()=>{try{
 if("serviceWorker" in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){const sc=new URL(r.scope).pathname;if(sc==="/jotun-rehber/")await r.unregister();}}
 if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith("jotun-endustri-v")).map(k=>caches.delete(k)));}
}catch(e){}})();
</script></body></html>
